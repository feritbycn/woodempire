# Gizlilik politikası, kullanım şartları, veri silme ve yönetim panelini GitHub Pages'te yayınlar.
# docs/site/ içeriği gh-pages dalına kopyalanır; GitHub Pages bu daldan yayın yapar.
# Adres: https://feritbycn.github.io/woodempire/
name: Pages
on:
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/site → gh-pages
        run: |
          mkdir -p /tmp/site && cp -r docs/site/. /tmp/site/ && touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Pages: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
